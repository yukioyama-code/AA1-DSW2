<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Cadastro de produto e geração de QR Code."><title>Novo produto | Vendinha</title><link rel="stylesheet" href="dist/style.css"></head>
  <body class="bg-surface font-sans text-ink antialiased">
    <header class="sticky top-0 z-40 border-b border-line bg-white"><nav class="mx-auto flex h-16 max-w-4xl items-center justify-between px-4 sm:px-6"><a class="font-bold text-brand" href="vendedor.html">← Painel</a><strong>Novo produto</strong><span class="w-12"></span></nav></header>
    <main class="mx-auto max-w-4xl px-4 pb-28 pt-6 sm:px-6 md:pb-12"><div class="grid gap-6 md:grid-cols-[1fr_300px]">
      <form class="rounded-2xl border border-line bg-white p-5 shadow-sm" onsubmit="return false"><p class="text-xs font-black uppercase tracking-[.18em] text-brand">Informações do produto</p><h1 class="mt-2 text-2xl font-black">Cadastre o que será vendido</h1>
        <label class="mt-6 block text-sm font-extrabold" for="product-name">Nome</label><input class="mt-2 min-h-12 w-full rounded-xl border border-line bg-white px-4 outline-none transition focus:border-brand focus:ring-3 focus:ring-brand/10" id="product-name" value="Café coado">
        <label class="mt-5 block text-sm font-extrabold" for="description">Descrição</label><textarea class="mt-2 min-h-28 w-full rounded-xl border border-line px-4 py-3 outline-none focus:border-brand focus:ring-3 focus:ring-brand/10" id="description">Café passado na hora.</textarea>
        <div class="mt-5 grid grid-cols-2 gap-3"><div><label class="block text-sm font-extrabold" for="price">Preço</label><input class="mt-2 min-h-12 w-full rounded-xl border border-line px-4 outline-none focus:border-brand" id="price" value="3,00"></div><div><label class="block text-sm font-extrabold" for="stock">Estoque inicial</label><input class="mt-2 min-h-12 w-full rounded-xl border border-line px-4 outline-none focus:border-brand" id="stock" type="number" value="12"></div></div>
        <div class="mt-5 grid grid-cols-2 gap-3"><div><label class="block text-sm font-extrabold" for="category">Categoria</label><select class="mt-2 min-h-12 w-full rounded-xl border border-line px-3 outline-none focus:border-brand" id="category"><option>Bebidas</option><option>Doces</option><option>Salgados</option></select></div><div><label class="block text-sm font-extrabold" for="minimum">Estoque mínimo</label><input class="mt-2 min-h-12 w-full rounded-xl border border-line px-4 outline-none focus:border-brand" id="minimum" type="number" value="4"></div></div>
        <label class="mt-5 block text-sm font-extrabold" for="product-image">Imagem</label><input class="mt-2 block w-full rounded-xl border border-dashed border-line p-3 text-sm" id="product-image" type="file" accept="image/*"><img class="mt-3 hidden h-36 w-full rounded-xl object-cover" id="image-preview" alt="Prévia da imagem selecionada">
        <button class="mt-7 min-h-13 w-full rounded-xl bg-brand px-5 font-extrabold text-white" type="button" data-demo-confirm="product">Salvar e gerar QR Code</button><div class="mt-4 hidden rounded-xl bg-emerald-50 p-4 text-sm font-bold text-success" data-feedback="product">✓ Produto salvo no protótipo. O QR Code está disponível ao lado.</div>
      </form>
      <aside class="h-fit rounded-2xl bg-brand-dark p-5 text-center text-white shadow-card md:sticky md:top-20"><p class="text-xs font-black uppercase tracking-[.18em] text-blue-200">Etiqueta do produto</p><div class="qr-pattern mx-auto mt-5 grid size-44 place-items-center rounded-xl border-[10px] border-white"><span class="rounded bg-white px-2 py-1 text-xs font-black text-brand-dark">PRODUTO</span></div><h2 class="mt-5 text-xl font-black">Café coado</h2><p class="mt-1 text-sm text-blue-100">Leia para acessar e pagar</p><button class="mt-5 min-h-11 w-full rounded-xl bg-white font-extrabold text-brand-dark" type="button">Baixar etiqueta</button></aside>
    </div></main>
    <nav class="safe-bottom fixed inset-x-0 bottom-0 z-50 grid grid-cols-3 border-t border-line bg-white px-2 pt-2 md:hidden" aria-label="Navegação do vendedor"><a class="text-center text-xs font-bold text-muted" href="vendedor.html"><span class="block text-xl">⌂</span>Início</a><a class="text-center text-xs font-extrabold text-brand" href="cadastro-produto.html"><span class="block text-xl">□</span>Produtos</a><a class="text-center text-xs font-bold text-muted" href="relatorios.html"><span class="block text-xl">▥</span>Relatórios</a></nav>
    <script src="script.js?v=2"></script>
  </body>
</html>
